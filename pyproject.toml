[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplifications
    "DJ",  # Django-specific checks
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
